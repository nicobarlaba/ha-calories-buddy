log_meal_text:
  name: Log Meal from Natural Text
  description: Parse a natural language meal description via LLM and log calories and macros deterministically.
  fields:
    text:
      name: Meal Description
      description: Natural language utterance (e.g. "For lunch 80g basmati rice Scotti, 1 tbsp olive oil, 250g cooked lentils").
      required: true
      selector:
        text:
    person:
      name: Person (optional)
      description: Person display name, person_id, or person.* entity ID. Defaults to calling HA user.
      selector:
        text:
    meal_slot:
      name: Meal Slot (optional)
      selector:
        text:
    date:
      name: Date (YYYY-MM-DD, optional)
      selector:
        text:

log_meal_item:
  name: Log Single Food Item
  description: Log a specific food item deterministically without calling an LLM.
  fields:
    food_id:
      name: Food ID
      selector:
        text:
    barcode:
      name: Barcode (EAN)
      selector:
        text:
    name:
      name: Food Name
      selector:
        text:
    quantity:
      name: Quantity
      required: true
      selector:
        number:
          min: 0.1
          max: 5000
          step: 0.5
    unit:
      name: Unit
      default: g
      selector:
        text:
    state:
      name: Preparation State
      default: unspecified
      selector:
        select:
          options:
            - raw
            - cooked
            - ready_to_eat
            - unspecified
    meal_slot:
      name: Meal Slot (optional)
      selector:
        text:
    person:
      name: Person (optional)
      selector:
        text:

confirm_meal:
  name: Confirm Pending Meal
  description: Confirm a meal waiting in pending confirmation state.
  fields:
    log_id:
      name: Meal Log ID
      required: true
      selector:
        text:
    promote_to_vault:
      name: Save Estimated Foods to Vault
      default: false
      selector:
        boolean:
    person:
      name: Person (optional)
      selector:
        text:

update_meal_item:
  name: Update Meal Item
  description: Adjust quantity, unit, or preparation state of a logged item.
  fields:
    log_id:
      name: Meal Log ID
      required: true
      selector:
        text:
    item_id:
      name: Meal Item ID
      required: true
      selector:
        text:
    quantity:
      name: New Quantity
      required: true
      selector:
        number:
          min: 0.1
          max: 5000
          step: 0.5
    unit:
      name: New Unit (optional)
      selector:
        text:
    state:
      name: New State (optional)
      selector:
        select:
          options:
            - raw
            - cooked
            - ready_to_eat
    food_id:
      name: Replacement Food ID (optional)
      selector:
        text:
    person:
      name: Person (optional)
      selector:
        text:

add_meal_item:
  name: Add Ingredient to Logged Meal
  description: Resolve a food item and append it to an already logged meal, recalculating parent totals.
  fields:
    log_id:
      name: Meal Log ID
      required: true
      selector:
        text:
    food_id:
      name: Food ID (optional)
      selector:
        text:
    barcode:
      name: Barcode EAN/UPC (optional)
      selector:
        text:
    name:
      name: Food Name (optional if food_id or barcode set)
      selector:
        text:
    brand:
      name: Brand (optional)
      selector:
        text:
    quantity:
      name: Quantity
      required: true
      selector:
        number:
          min: 0.1
          max: 5000
          step: 0.5
    unit:
      name: Unit
      default: g
      selector:
        text:
    state:
      name: Preparation State
      default: unspecified
      selector:
        select:
          options:
            - unspecified
            - raw
            - cooked
            - ready_to_eat
    person:
      name: Person (optional)
      selector:
        text:

delete_meal_item:
  name: Remove Meal Item
  description: Remove a single ingredient from a logged meal and recalculate totals (or delete parent meal if empty).
  fields:
    log_id:
      name: Meal Log ID
      required: true
      selector:
        text:
    item_id:
      name: Meal Item ID
      required: true
      selector:
        text:
    person:
      name: Person (optional)
      selector:
        text:

update_meal_slot:
  name: Update Logged Meal Slot
  description: Move an already logged meal to a different meal slot (e.g., Breakfast, Lunch, Dinner).
  fields:
    log_id:
      name: Meal Log ID
      required: true
      selector:
        text:
    meal_slot:
      name: New Meal Slot
      required: true
      selector:
        text:
    person:
      name: Person (optional)
      selector:
        text:

delete_meal:
  name: Delete Meal
  description: Soft-delete a logged meal.
  fields:
    log_id:
      name: Meal Log ID
      required: true
      selector:
        text:
    person:
      name: Person (optional)
      selector:
        text:

lookup_barcode:
  name: Lookup Food Barcode
  description: Search local Food Vault and Open Food Facts by EAN/UPC barcode.
  fields:
    barcode:
      name: Barcode (EAN/UPC)
      required: true
      selector:
        text:
    person:
      name: Person (optional)
      selector:
        text:

log_weight:
  name: Log Body Weight
  description: Record today's body weight (kg) and update biometric snapshot.
  fields:
    weight_kg:
      name: Weight (kg)
      required: true
      selector:
        number:
          min: 20
          max: 350
          step: 0.1
          unit_of_measurement: kg
    person:
      name: Person (optional)
      selector:
        text:

suggest_meal:
  name: Suggest Meal / Recipe
  description: Generate 1-3 AI-proposed meals deterministically scaled to macro budget and hard constraints.
  fields:
    meal_slot:
      name: Meal Slot (optional)
      selector:
        text:
    hint:
      name: Hint / Craving (optional)
      selector:
        text:
    max_cook_minutes:
      name: Max Cook Time (minutes, optional)
      selector:
        number:
          min: 5
          max: 180
          step: 5
    count:
      name: Number of Suggestions
      default: 3
      selector:
        number:
          min: 1
          max: 3
          step: 1
    budget_mode:
      name: Budget Mode (optional)
      default: auto
      selector:
        select:
          options:
            - auto
            - remaining
            - slot
    person:
      name: Person (optional)
      selector:
        text:

generate_meal_plan:
  name: Generate Meal Plan
  description: Generate a 1-7 day personalized meal plan scaled within +-5% of daily targets.
  fields:
    start_date:
      name: Start Date (YYYY-MM-DD, optional)
      selector:
        text:
    num_days:
      name: Number of Days
      default: 7
      selector:
        number:
          min: 1
          max: 7
          step: 1
    meal_prep_mode:
      name: Meal Prep Batch Reuse
      default: false
      selector:
        boolean:
    notes:
      name: Planning Notes (optional)
      selector:
        text:
    person:
      name: Person (optional)
      selector:
        text:

swap_plan_meal:
  name: Swap Planned Meal
  description: Replace one planned meal slot with a new option matching the day's macro budget.
  fields:
    plan_item_id:
      name: Planned Item ID
      required: true
      selector:
        text:
    instruction:
      name: Replacement Instruction (optional)
      selector:
        text:
    person:
      name: Person (optional)
      selector:
        text:

promote_plan_meal:
  name: Log Planned Meal as Eaten
  description: Promote a planned meal directly into a confirmed MealLog.
  fields:
    plan_item_id:
      name: Planned Item ID
      required: true
      selector:
        text:
    scale:
      name: Portion Multiplier
      default: 1.0
      selector:
        number:
          min: 0.25
          max: 3.0
          step: 0.25
    person:
      name: Person (optional)
      selector:
        text:

rebalance_today:
  name: Rebalance Remaining Meal Plan
  description: Adjust remaining meals today (or smooth excess/deficit across 2-4 days).
  fields:
    date:
      name: Target Date (YYYY-MM-DD, optional)
      selector:
        text:
    spread_days:
      name: Multi-Day Smooth Days (2-4, optional)
      selector:
        number:
          min: 2
          max: 4
          step: 1
    allow_llm_swap:
      name: Allow Smart Recipe Swap if Rescale Insufficient
      default: true
      selector:
        boolean:
    person:
      name: Person (optional)
      selector:
        text:

set_preference:
  name: Set Dietary Preference or Hard Constraint
  description: Save a global household rule or per-person dietary preference/allergen.
  fields:
    scope:
      name: Scope
      required: true
      selector:
        select:
          options:
            - global
            - person
    target_type:
      name: Target Type
      required: true
      selector:
        select:
          options:
            - ingredient
            - category
            - brand
            - dish
    target_value:
      name: Food / Brand / Category
      required: true
      selector:
        text:
    stance:
      name: Stance
      required: true
      selector:
        select:
          options:
            - allergy
            - intolerance
            - blacklist
            - dislike
            - like
            - love
            - preferred_brand
    notes:
      name: Notes (optional)
      selector:
        text:
    person:
      name: Person (optional)
      selector:
        text:

save_recipe:
  name: Save Homemade Recipe
  description: Create or update a homemade composite recipe and sync it to the Global Food Vault.
  fields:
    name:
      name: Recipe Name
      required: true
      selector:
        text:
    ingredients:
      name: Ingredients List
      description: List of ingredient objects with name, quantity, unit, state, and optional food_id.
      required: true
      selector:
        object:
    servings:
      name: Servings / Portions
      default: 1.0
      selector:
        number:
          min: 0.25
          max: 100
          step: 0.25
    serving_unit:
      name: Serving Unit
      default: serving
      selector:
        select:
          options:
            - serving
            - slice
            - piece
    final_weight_g:
      name: Final Cooked Weight (g, optional)
      selector:
        number:
          min: 1
          max: 20000
          step: 1
          unit_of_measurement: g
    category:
      name: Category
      default: other
      selector:
        select:
          options:
            - other
            - snack
            - protein
            - carbs
            - dairy
            - legumes
            - produce
    allow_in_planner:
      name: Allow in AI Meal Planner
      default: false
      selector:
        boolean:
    notes:
      name: Notes (optional)
      selector:
        text:
    recipe_id:
      name: Existing Recipe ID (to update)
      selector:
        text:
    person:
      name: Person (optional)
      selector:
        text:

delete_recipe:
  name: Delete Homemade Recipe
  description: Delete a homemade recipe and its linked Vault food entry while preserving logged meal snapshots.
  fields:
    recipe_id:
      name: Recipe ID
      required: true
      selector:
        text:
    person:
      name: Person (optional)
      selector:
        text:

create_shopping_draft:
  name: Create Shopping List Draft
  description: Aggregate remaining unconsumed planned meals across a date range into an editable shopping draft.
  fields:
    start_date:
      name: Start Date (YYYY-MM-DD, optional)
      selector:
        text:
    end_date:
      name: End Date (YYYY-MM-DD, optional)
      selector:
        text:
    include_household:
      name: Merge Household Plans
      default: false
      selector:
        boolean:
    person:
      name: Person (optional)
      selector:
        text:

commit_shopping_draft:
  name: Push Shopping Draft to Todo List
  description: Send checked items from the active shopping draft to Home Assistant todo.* skipping duplicates.
  fields:
    draft_id:
      name: Draft ID (optional, defaults to latest)
      selector:
        text:
    todo_entity:
      name: Target Todo List (optional)
      selector:
        entity:
          domain: todo
    person:
      name: Person (optional)
      selector:
        text:

set_training_day:
  name: Set or Clear Training Day Override
  description: Manually mark a date as Training or Rest Day (or clear override to follow weekly schedule/calendar).
  fields:
    is_training_day:
      name: Training Day Active
      default: true
      selector:
        boolean:
    date:
      name: Date (YYYY-MM-DD, optional)
      selector:
        text:
    clear_override:
      name: Clear Manual Override
      default: false
      selector:
        boolean:
    person:
      name: Person (optional)
      selector:
        text:

save_workout_schedule:
  name: Save Recurring Workout Schedule
  description: Add or update a weekly recurring workout slot (0=Monday .. 6=Sunday) used for Training Day detection and meal planning.
  fields:
    weekday:
      name: Weekday (0=Mon .. 6=Sun)
      required: true
      selector:
        number:
          min: 0
          max: 6
          step: 1
    title:
      name: Workout Title
      required: true
      selector:
        text:
    activity_type:
      name: Activity Type
      default: strength
      selector:
        select:
          options:
            - strength
            - cardio
            - running
            - cycling
            - hiit
            - mobility
            - sport
            - other
    duration_min:
      name: Duration (minutes)
      default: 60
      selector:
        number:
          min: 5
          max: 480
          step: 5
          unit_of_measurement: min
    estimated_kcal:
      name: Estimated Burn (kcal, optional)
      selector:
        number:
          min: 0
          max: 5000
          step: 10
          unit_of_measurement: kcal
    time_of_day:
      name: Time of Day (HH:MM)
      default: "18:00"
      selector:
        text:
    notes:
      name: Notes (optional)
      selector:
        text:
    enabled:
      name: Enabled
      default: true
      selector:
        boolean:
    schedule_id:
      name: Schedule ID (to update)
      selector:
        text:
    person:
      name: Person (optional)
      selector:
        text:
