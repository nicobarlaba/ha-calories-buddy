  <rect x="66" y="138" width="828" height="84" rx="12" fill="#0f172a" stroke="#334155"/>
  <rect x="82" y="150" width="710" height="34" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="96" y="172" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13">80g basmati rice Scotti, 1 tbsp olive oil, 180g chicken breast</text>
  <rect x="802" y="150" width="76" height="34" rx="8" fill="#0ea5e9"/>
  <text x="840" y="172" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Log</text>

