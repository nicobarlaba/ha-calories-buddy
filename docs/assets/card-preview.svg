  <rect x="322" y="192" width="124" height="22" rx="11" fill="#1e3a5f"/>
  <text x="384" y="207" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Slot: Lunch</text>

  <!-- Summary Ring + Macro & Fiber Bars -->
  <g transform="translate(80, 238)">
    <circle cx="62" cy="66" r="50" fill="none" stroke="#334155" stroke-width="10"/>
    <circle cx="62" cy="66" r="50" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-dasharray="235 314" transform="rotate(-90 62 66)"/>
    <text x="62" y="65" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" text-anchor="middle">1,740</text>
    <text x="62" y="83" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">/ 2,320 kcal</text>
  </g>

  <g transform="translate(230, 240)" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">
    <text x="0" y="12" fill="#cbd5e1">Protein</text>
    <text x="664" y="12" fill="#f8fafc" text-anchor="end"><tspan font-weight="700">138g</tspan> / 165g</text>
    <rect x="0" y="17" width="664" height="8" rx="4" fill="#0f172a"/>
    <rect x="0" y="17" width="555" height="8" rx="4" fill="#42a5f5"/>

    <text x="0" y="44" fill="#cbd5e1">Carbs</text>
    <text x="664" y="44" fill="#f8fafc" text-anchor="end"><tspan font-weight="700">186g</tspan> / 260g</text>
    <rect x="0" y="49" width="664" height="8" rx="4" fill="#0f172a"/>
    <rect x="0" y="49" width="475" height="8" rx="4" fill="#ffa726"/>

    <text x="0" y="76" fill="#cbd5e1">Fat</text>
    <text x="664" y="76" fill="#f8fafc" text-anchor="end"><tspan font-weight="700">48g</tspan> / 68g</text>
    <rect x="0" y="81" width="664" height="8" rx="4" fill="#0f172a"/>
    <rect x="0" y="81" width="468" height="8" rx="4" fill="#ab47bc"/>

    <text x="0" y="108" fill="#cbd5e1">Fiber</text>
    <text x="664" y="108" fill="#f8fafc" text-anchor="end"><tspan font-weight="700">26g</tspan> / 32g</text>
    <rect x="0" y="113" width="664" height="8" rx="4" fill="#0f172a"/>
    <rect x="0" y="113" width="539" height="8" rx="4" fill="#66bb6a"/>
  </g>

  <!-- Pills -->
  <rect x="66" y="380" width="166" height="26" rx="13" fill="#14532d"/>
  <text x="149" y="397" fill="#bbf7d0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Remaining: 580 kcal</text>
  <rect x="242" y="380" width="268" height="26" rx="13" fill="#0f172a" stroke="#334155"/>
  <text x="376" y="397" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Adaptive TDEE: 2,680 kcal · High Conf.</text>
  <rect x="520" y="380" width="150" height="26" rx="13" fill="#065f46"/>
  <text x="595" y="397" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Training Day ON</text>

  <!-- Mini Trends & Diary Split Preview -->
  <rect x="66" y="420" width="490" height="114" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="84" y="444" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">Lunch — 715 kcal (Confirmed)</text>
  <text x="84" y="468" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Basmati Rice (Scotti) · 80g raw (282 kcal)</text>
  <text x="84" y="488" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Chicken Breast (Raw) · 180g raw (198 kcal · P 41.4g)</text>
  <text x="84" y="508" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Mixed Salad + Olive Oil · 10g (115 kcal)</text>

  <rect x="568" y="420" width="326" height="114" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="584" y="443" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">Weight EMA Trend (On Track)</text>
  <text x="878" y="443" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="end">-0.42 kg/wk</text>
  <polyline fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" points="588,468 632,472 676,476 720,484 764,492 808,498 868,506"/>
  <line x1="588" y1="516" x2="872" y2="516" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="588" y="527" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Garmin 0.94× calibrated · Goal ETA: 6.5w</text>
</svg>
