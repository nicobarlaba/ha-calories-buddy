<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="HA Calories Buddy Custom Card v0.3.0 Preview">
  <defs>
    <linearGradient id="frameBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="emblemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03a9f4"/>
      <stop offset="100%" stop-color="#26a69a"/>
    </linearGradient>
  </defs>

  <rect width="960" height="580" rx="20" fill="url(#frameBg)"/>

  <!-- Lovelace Card container -->
  <rect x="40" y="24" width="880" height="532" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="66" y="46" width="28" height="28" rx="8" fill="url(#emblemBg)"/>
  <circle cx="80" cy="60" r="8" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="38 14"/>
  <text x="104" y="67" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Calories Buddy</text>

  <rect x="646" y="45" width="76" height="30" rx="15" fill="#0f172a" stroke="#334155"/>
  <text x="684" y="65" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Marco</text>
  <rect x="730" y="45" width="82" height="30" rx="15" fill="#065f46" stroke="#10b981"/>
  <text x="771" y="65" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Training</text>
  <circle cx="834" cy="60" r="15" fill="#0f172a" stroke="#334155"/>
  <text x="834" y="64" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">⚙</text>
  <circle cx="872" cy="60" r="15" fill="#0f172a" stroke="#334155"/>
  <text x="872" y="65" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="15" text-anchor="middle">↻</text>

  <!-- 5-Tab Segmented Bar -->
  <rect x="66" y="88" width="828" height="38" rx="10" fill="#0f172a"/>
  <rect x="70" y="92" width="160" height="30" rx="8" fill="#334155" stroke="#475569"/>
  <text x="150" y="112" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Today</text>
  <text x="315" y="112" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Plan · Workouts</text>
  <text x="480" y="112" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Shop (todo.*)</text>
  <text x="645" y="112" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Vault · Recipes</text>
  <text x="810" y="112" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Trends</text>

