<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="HA Calories Buddy Custom Card Preview">
  <defs>
    <linearGradient id="frameBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Outer presentation backdrop -->
  <rect width="960" height="540" rx="20" fill="url(#frameBg)"/>

  <!-- Lovelace Card container -->
  <rect x="48" y="28" width="864" height="484" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- Card Header -->
  <text x="76" y="68" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="700">Calories Buddy</text>
  <rect x="760" y="45" width="124" height="30" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="822" y="65" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Marco</text>

  <!-- Tabs -->
  <rect x="76" y="88" width="84" height="32" rx="8" fill="#0ea5e9"/>
  <text x="118" y="109" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Today</text>
  <text x="208" y="109" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Food Vault</text>
  <line x1="76" y1="128" x2="884" y2="128" stroke="#334155" stroke-width="1"/>

  <!-- Quick Log Bar -->
  <rect x="76" y="142" width="808" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <rect x="92" y="154" width="688" height="34" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="106" y="176" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13">80g basmati rice Scotti, 1 tbsp olive oil, 250g cooked lentils</text>
  <rect x="790" y="154" width="78" height="34" rx="8" fill="#0ea5e9"/>
  <text x="829" y="176" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Log</text>

  <rect x="92" y="196" width="124" height="24" rx="6" fill="#334155"/>
  <text x="154" y="212" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Search &amp; Log</text>
  <rect x="226" y="196" width="110" height="24" rx="6" fill="#334155"/>
  <text x="281" y="212" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Scan Barcode</text>

  <!-- Summary Ring + Macro Bars -->
  <g transform="translate(88, 246)">
    <circle cx="62" cy="62" r="50" fill="none" stroke="#334155" stroke-width="10"/>
    <circle cx="62" cy="62" r="50" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-dasharray="226 314" transform="rotate(-90 62 62)"/>
    <text x="62" y="61" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" text-anchor="middle">1,490</text>
    <text x="62" y="79" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">/ 2,100 kcal</text>
  </g>

  <g transform="translate(240, 250)" font-family="system-ui, -apple-system, sans-serif" font-size="13">
    <text x="0" y="12" fill="#cbd5e1">Protein</text>
    <text x="644" y="12" fill="#f8fafc" text-anchor="end"><tspan font-weight="700">118g</tspan> / 155g</text>
    <rect x="0" y="19" width="644" height="9" rx="4.5" fill="#0f172a"/>
    <rect x="0" y="19" width="490" height="9" rx="4.5" fill="#42a5f5"/>

    <text x="0" y="50" fill="#cbd5e1">Carbs</text>
    <text x="644" y="50" fill="#f8fafc" text-anchor="end"><tspan font-weight="700">162g</tspan> / 220g</text>
    <rect x="0" y="57" width="644" height="9" rx="4.5" fill="#0f172a"/>
    <rect x="0" y="57" width="474" height="9" rx="4.5" fill="#ffa726"/>

    <text x="0" y="88" fill="#cbd5e1">Fat</text>
    <text x="644" y="88" fill="#f8fafc" text-anchor="end"><tspan font-weight="700">41g</tspan> / 65g</text>
    <rect x="0" y="95" width="644" height="9" rx="4.5" fill="#0f172a"/>
    <rect x="0" y="95" width="406" height="9" rx="4.5" fill="#ab47bc"/>
  </g>

  <!-- Pills -->
  <rect x="76" y="382" width="168" height="26" rx="13" fill="#14532d"/>
  <text x="160" y="399" fill="#bbf7d0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Remaining: 610 kcal</text>
  <rect x="256" y="382" width="218" height="26" rx="13" fill="#0f172a" stroke="#334155"/>
  <text x="365" y="399" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">TDEE: 2,540 kcal (Garmin)</text>

  <!-- Meal Card (Hybrid Confirmation) -->
  <rect x="76" y="420" width="808" height="76" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="94" y="444" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Lunch — 660 kcal</text>
  <rect x="738" y="429" width="130" height="22" rx="11" fill="#0369a1"/>
  <text x="803" y="444" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Confirmed</text>
  <text x="94" y="467" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Basmati Rice (Scotti) · 80g raw (282 kcal)  |  Extra Virgin Olive Oil · 1 tbsp (88 kcal)</text>
  <text x="94" y="485" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Lentils (Cooked) · 250g cooked (290 kcal · P 22.5g C 40.0g F 1.0g)</text>
</svg>
