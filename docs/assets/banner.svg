<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="HA Calories Buddy Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#132a4a"/>
      <stop offset="100%" stop-color="#0f3d4c"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#bgGrad)"/>
  <circle cx="1030" cy="70" r="180" fill="#38bdf8" opacity="0.06"/>
  <circle cx="150" cy="280" r="140" fill="#34d399" opacity="0.06"/>

  <!-- Logo emblem -->
  <g transform="translate(88, 72)">
    <rect x="0" y="0" width="176" height="176" rx="34" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="88" cy="88" r="58" fill="none" stroke="#334155" stroke-width="12"/>
    <circle cx="88" cy="88" r="58" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="285 365" transform="rotate(-90 88 88)"/>
    <path d="M88 54 C74 68 70 84 82 97 C86 101 86 109 82 114 C96 109 107 95 103 78 C100 66 92 59 88 54 Z" fill="#34d399"/>
    <circle cx="88" cy="88" r="6" fill="#0f172a"/>
  </g>

  <!-- Title and subtitle -->
  <text x="304" y="120" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="50" font-weight="800" letter-spacing="-0.5">
    HA Calories Buddy
  </text>
  <text x="304" y="160" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
    Privacy-First AI Dietitian, Food Diary &amp; Barcode Scanner for Home Assistant
  </text>

  <!-- Feature pills -->
  <g transform="translate(304, 194)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">
    <rect x="0" y="0" width="132" height="34" rx="17" fill="url(#accentGlow)" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="66" y="22" fill="#e0f2fe" text-anchor="middle">Multi-Person</text>

    <rect x="146" y="0" width="174" height="34" rx="17" fill="url(#accentGlow)" stroke="#34d399" stroke-opacity="0.45"/>
    <text x="233" y="22" fill="#d1fae5" text-anchor="middle">Deterministic Macros</text>

    <rect x="334" y="0" width="130" height="34" rx="17" fill="url(#accentGlow)" stroke="#60a5fa" stroke-opacity="0.45"/>
    <text x="399" y="22" fill="#dbeafe" text-anchor="middle">Voice Assist</text>

    <rect x="478" y="0" width="172" height="34" rx="17" fill="url(#accentGlow)" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text x="564" y="22" fill="#ede9fe" text-anchor="middle">Cloud &amp; Local LLMs</text>

    <rect x="664" y="0" width="180" height="34" rx="17" fill="url(#accentGlow)" stroke="#fbbf24" stroke-opacity="0.45"/>
    <text x="754" y="22" fill="#fef3c7" text-anchor="middle">Auto-Registered Card</text>
  </g>

  <text x="304" y="268" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14">
