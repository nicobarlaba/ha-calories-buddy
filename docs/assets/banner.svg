      <stop offset="100%" stop-color="#34d399" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#bgGrad)"/>
  <circle cx="1030" cy="70" r="180" fill="#38bdf8" opacity="0.06"/>
  <circle cx="150" cy="280" r="140" fill="#34d399" opacity="0.06"/>

  <!-- Logo emblem -->
  <g transform="translate(82, 72)">
    <rect x="0" y="0" width="176" height="176" rx="34" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="88" cy="88" r="58" fill="none" stroke="#334155" stroke-width="12"/>
    <circle cx="88" cy="88" r="58" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="285 365" transform="rotate(-90 88 88)"/>
    <path d="M88 54 C74 68 70 84 82 97 C86 101 86 109 82 114 C96 109 107 95 103 78 C100 66 92 59 88 54 Z" fill="#34d399"/>
    <circle cx="88" cy="88" r="6" fill="#0f172a"/>
  </g>

  <!-- Title and subtitle -->
  <text x="296" y="114" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="50" font-weight="800" letter-spacing="-0.5">
